name: Scheduled Publish

# Weekly rebuild so future-dated content (dated blog posts) goes live even on
# a week with no other push. Hugo excludes future-dated content by default,
# so a post sitting on main with a future `date` won't appear until some
# build runs on or after that date. This is that build. Cloudflare also
# builds on every push to main, so this job only matters when a post's date
# crosses into the past with no push happening that day.
#
# CLOUDFLARE_DEPLOY_HOOK: Workers & Pages -> clearheadtrading -> Settings ->
# Builds -> Deploy Hooks (branch main). NETLIFY_BUILD_HOOK only matters while
# Netlify is kept as a fallback after the move; delete it from the repo
# secrets (and this step) once Netlify is switched off.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare and Netlify builds
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ] && [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::Neither CLOUDFLARE_DEPLOY_HOOK nor NETLIFY_BUILD_HOOK is set."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "Triggering Cloudflare build"
            curl -sf -X POST "$CLOUDFLARE_DEPLOY_HOOK"
            echo
          fi
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            echo "Triggering Netlify build"
            curl -sf -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          fi
