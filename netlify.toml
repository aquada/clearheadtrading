[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.162.1"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  TZ = "Africa/Johannesburg"

# Netlify is only the fallback host now (site moved to Cloudflare Workers
# 2026-11). The /go/ affiliate redirects live in static/_redirects, which
# both Netlify and Cloudflare read. Delete this file once Netlify is off.
